<div class="login-container">

    <div class="login-card">

        <img src="assets/images/logo.png"
             alt="Logo Aluminá"
             class="login-logo">

        <h1>Entrar</h1>

        <p class="login-subtitulo">
            Acesse sua conta para continuar
        </p>

        <form id="form-login">

            <div class="campo">
                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >
            </div>

            <div class="campo">
                <label for="senha">Senha</label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required
                >
            </div>

            <a href="#" id="link-esqueci-senha" class="esqueci-senha">
                Esqueci minha senha
            </a>

            <button type="submit">
                Entrar
            </button>

        </form>

        <p class="cadastro">
            Ainda não possui uma conta?
            <a href="#" id="link-cadastro">Cadastre-se</a>
        </p>

    </div>

</div>
